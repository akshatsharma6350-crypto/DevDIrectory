<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevDirectory — engineering portal and project store for distributed teams." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      /* apply saved theme before first paint (no flash) */
      try { var t = localStorage.getItem('dd_theme') || 'dark'; document.documentElement.dataset.theme = t; document.documentElement.classList.toggle('dark', t === 'dark'); } catch (e) {}
    </script>
    <title>DevDirectory — Engineering Portal & Project Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
